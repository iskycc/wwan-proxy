name: Test, build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run static checks
        run: go vet ./...

      - name: Validate OpenWrt init script
        run: |
          test -x openwrt/wwan-proxy.init
          sh -n openwrt/wwan-proxy.init

      - name: Validate Alpine installer and OpenRC files
        run: |
          test -x scripts/install-alpine.sh
          test -x alpine/wwan-proxy.openrc
          sh -n scripts/install-alpine.sh
          sh -n alpine/wwan-proxy.openrc
          test -s alpine/wwan-proxy.confd
          test -s alpine/wwan-proxy.logrotate

      - name: Validate scripts with Alpine 3.23 BusyBox ash
        run: |
          docker run --rm \
            --volume "${PWD}:/src:ro" \
            alpine:3.23 \
            sh -ec 'sh -n /src/scripts/install-alpine.sh; sh -n /src/alpine/wwan-proxy.openrc'

      - name: Run race-enabled tests
        run: go test -race ./...

  build:
    name: Build ${{ matrix.package_name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
            cc: gcc
            libc: glibc
            package_name: wwan-proxy-linux-amd64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            cc: gcc
            libc: glibc
            package_name: wwan-proxy-linux-arm64
          - goarch: amd64
            runner: ubuntu-24.04
            cc: musl-gcc
            libc: musl
            package_name: wwan-proxy-linux-amd64-musl
          - goarch: arm64
            runner: ubuntu-24.04-arm
            cc: musl-gcc
            libc: musl
            package_name: wwan-proxy-linux-arm64-musl
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install musl toolchain
        if: matrix.libc == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build package
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          LIBC: ${{ matrix.libc }}
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          package_dir="dist/${PACKAGE_NAME}"
          build_ldflags="-s -w -X main.version=${short_sha}"
          build_tags=()
          if [ "${LIBC}" = "musl" ]; then
            build_ldflags="${build_ldflags} -linkmode external -extldflags '-static'"
            build_tags=(-tags "netgo,osusergo")
          fi
          mkdir -p "${package_dir}"
          go build \
            "${build_tags[@]}" \
            -trimpath \
            -ldflags "${build_ldflags}" \
            -o "${package_dir}/wwan-proxy" \
            ./cmd/wwan-proxy
          cp README.md wwan-proxy.service "${package_dir}/"
          cp openwrt/wwan-proxy.init "${package_dir}/"
          cp scripts/install-alpine.sh "${package_dir}/"
          cp alpine/wwan-proxy.openrc alpine/wwan-proxy.confd alpine/wwan-proxy.logrotate "${package_dir}/"
          tar -C dist -czf "dist/${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"

      - name: Verify release package contents
        env:
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          set -euo pipefail
          archive="dist/${PACKAGE_NAME}.tar.gz"
          contents="dist/${PACKAGE_NAME}.contents"
          tar -tzf "${archive}" > "${contents}"
          for expected in \
            wwan-proxy README.md wwan-proxy.service wwan-proxy.init \
            install-alpine.sh wwan-proxy.openrc wwan-proxy.confd wwan-proxy.logrotate
          do
            grep --fixed-strings --line-regexp --quiet "${PACKAGE_NAME}/${expected}" "${contents}"
          done

      - name: Smoke-test musl package on Alpine 3.23
        if: matrix.libc == 'musl'
        env:
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum "./${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.SHA256SUMS"
          )
          docker run --rm \
            --cap-add SETFCAP \
            --volume "${PWD}:/workspace:ro" \
            alpine:3.23 \
            sh /workspace/scripts/install-alpine.sh \
              --archive "/workspace/dist/${PACKAGE_NAME}.tar.gz" \
              --checksum "/workspace/dist/${PACKAGE_NAME}.SHA256SUMS" \
              --no-start

      - name: Verify static musl binary
        if: matrix.libc == 'musl'
        env:
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          set -euo pipefail
          binary="dist/${PACKAGE_NAME}/wwan-proxy"
          file "${binary}"
          if readelf -l "${binary}" | grep --quiet 'INTERP'; then
            echo "musl build unexpectedly contains a dynamic program interpreter" >&2
            exit 1
          fi
          if readelf -d "${binary}" 2>&1 | grep --quiet 'NEEDED'; then
            echo "musl build unexpectedly depends on a shared library" >&2
            exit 1
          fi
          file "${binary}" | grep --quiet 'statically linked'

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.package_name }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          release_tag="build-${short_sha}"
          release_title="Continuous build ${short_sha}"
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${release_tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --generate-notes
          fi
