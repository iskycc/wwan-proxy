name: Test, build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run static checks
        run: go vet ./...

      - name: Run race-enabled tests
        run: go test -race ./...

  build:
    name: Build ${{ matrix.package_name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            cc: gcc
            libc: glibc
            package_name: wwan-proxy-linux-amd64
          - goarch: arm64
            cc: aarch64-linux-gnu-gcc
            libc: glibc
            package_name: wwan-proxy-linux-arm64
          - goarch: amd64
            cc: musl-gcc
            libc: musl
            package_name: wwan-proxy-linux-amd64-musl
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ARM64 cross compiler
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Install musl toolchain
        if: matrix.libc == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build package
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          LIBC: ${{ matrix.libc }}
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          package_dir="dist/${PACKAGE_NAME}"
          build_ldflags="-s -w -X main.version=${short_sha}"
          build_tags=()
          if [ "${LIBC}" = "musl" ]; then
            build_ldflags="${build_ldflags} -linkmode external -extldflags '-static'"
            build_tags=(-tags "netgo,osusergo")
          fi
          mkdir -p "${package_dir}"
          go build \
            "${build_tags[@]}" \
            -trimpath \
            -ldflags "${build_ldflags}" \
            -o "${package_dir}/wwan-proxy" \
            ./cmd/wwan-proxy
          cp README.md wwan-proxy.service "${package_dir}/"
          tar -C dist -czf "dist/${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"

      - name: Verify static musl binary
        if: matrix.libc == 'musl'
        env:
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          set -euo pipefail
          binary="dist/${PACKAGE_NAME}/wwan-proxy"
          file "${binary}"
          if readelf -l "${binary}" | grep --quiet 'INTERP'; then
            echo "musl build unexpectedly contains a dynamic program interpreter" >&2
            exit 1
          fi
          if readelf -d "${binary}" 2>&1 | grep --quiet 'NEEDED'; then
            echo "musl build unexpectedly depends on a shared library" >&2
            exit 1
          fi
          file "${binary}" | grep --quiet 'statically linked'

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.package_name }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          release_tag="build-${short_sha}"
          release_title="Continuous build ${short_sha}"
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${release_tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --generate-notes
          fi
